name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR runs are pointless; cancel them. Never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc` both typechecks and verifies that dist/ emits cleanly.
      - name: Build
        run: pnpm build

      - name: Lint with oxfmt and oxlint
        run: pnpm lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The low entry is the exact `devEngines` floor, not `22`: a major-only entry floats to
        # the newest 22.x, which tests above the floor and hides a tool that needs more than
        # the repo admits — the same trap the min-node job spells out below. Keep it in step
        # with `devEngines.runtime` in package.json; the high entry is `.nvmrc`.
        node: ['22.22.1', 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  # The type tests assert inference at three or four dependencies, which is far
  # too small to notice the two ways this package's types fail: a per-dependency
  # cost multiplying everyone's build time, and a depth-limiter trip that collapses
  # inference to `never` past ~50 dependencies. Both pass the full test suite. This
  # job checks the shapes big enough to expose them.
  types-perf:
    name: Type-checking budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check type-instantiation budgets
        run: pnpm bench:types

  # The matrix above can't reach `engines.node` — Vitest needs a far newer
  # runtime than the floor — so without this job the floor is an unverified
  # claim. This imports the built `dist/` the way a consumer would, on exactly
  # the Node the package declares, catching a bad emit, a broken ESM specifier,
  # or a built-in newer than the floor before a consumer does.
  min-node:
    name: Smoke test built package on minimum Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Import built package on the declared minimum Node
        run: |
          # Keep every component the floor declares: `node:16.9-alpine` floats to
          # the newest 16.9.x, which would test above the floor and hide a break.
          MIN=$(node -p "require('./package.json').engines.node.match(/[0-9]+(\.[0-9]+)*/)[0]")
          echo "engines.node floor resolves to Node $MIN"
          docker run --rm -v "$PWD":/app -w /app "node:$MIN-alpine" node scripts/smoke-min-node.mjs

  # `exports` condition order, the deep-import block and `files` are consumer-facing
  # contracts that nothing in `src/` can see: each one is correct in this checkout and
  # wrong only in the tarball, so no test reaches them. publint packs the package and
  # reads it the way a registry consumer would; attw resolves the published types under
  # each module mode, which is what actually pins `types` ahead of `default`.
  # `cjs-resolves-to-esm` is ignored because ESM-only is a deliberate choice, not a defect.
  package:
    name: Validate published package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check packed package and published types
        run: pnpm check:package

  # Single stable status check to require in branch protection, so the matrix
  # can change without anyone having to update the repo settings.
  ci:
    name: CI
    if: always()
    needs: [lint, test, types-perf, min-node, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        # `skipped` counts as a failure too: a required job that never ran must not
        # report success to branch protection.
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
